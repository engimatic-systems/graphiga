# Query-local Datalog programs for spike/query-datafrog. Data lives in store/.
# Each program exports result(NodeId). Facts are projected from the document graph.
[queries]
open_backups = '''
result(N) :- attr(N, "status", "open"), attr(N, "tags", "backups").
'''
ready = '''
active(N) :- attr(N, "status", "open").
active(N) :- attr(N, "status", "in_progress").
closed(N) :- attr(N, "status", "closed").
unresolved(N) :- edge(N, "deps", D), not closed(D).
result(N) :- active(N), not unresolved(N).
'''
epic_descendants = '''
ancestor(N, A) :- edge(N, "parent", A).
ancestor(N, A) :- edge(N, "parent", P), ancestor(P, A).
result(N) :- ancestor(N, "demo-epic"), N != "demo-epic".
'''
