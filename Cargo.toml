[package]
name = "graphiga"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
markdown = "1.0.0"
nemo = { git = "https://github.com/knowsys/nemo", tag = "v0.10.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"
