name: Build and validate

on:
  push:
    branches:
      - v0
  pull_request:
    branches:
      - v0

permissions:
  contents: read

concurrency:
  group: graphiga-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /tmp/graphiga-ci-target

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check formatting
        run: nix develop --no-write-lock-file path:. --command cargo fmt --check

      - name: Run tests
        run: nix develop --no-write-lock-file path:. --command cargo test --locked

      - name: Run Clippy
        run: >-
          nix develop --no-write-lock-file path:.
          --command cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executable
        run: >-
          nix develop --no-write-lock-file path:.
          --command cargo build --locked --release

      - name: Run shared predicate acceptance
        run: >-
          nix develop --no-write-lock-file path:.
          --command python3 query-spikes/verify.py
          --binary "$CARGO_TARGET_DIR/release/graphiga"
          --language predicates
